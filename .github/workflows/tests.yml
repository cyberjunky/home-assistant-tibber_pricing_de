name: "Tests"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  lint:
    name: "Pre-commit checks"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - name: "Set up Python"
          uses: actions/setup-python@v7.1.0
          with:
            python-version: "3.14"

        - name: "Install requirements"
          run: pip install -r requirements.txt -r requirements_lint.txt

        - name: "Run pre-commit"
          run: pre-commit run --all-files --hook-stage manual --config .github/pre-commit-config.yaml

  tests:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - name: "Set up Python"
          uses: actions/setup-python@v7.1.0
          with:
            python-version: "3.14"

        - name: "Install requirements"
          run: pip install -r requirements.txt -r requirements_lint.txt

        - name: "Run pytest"
          run: pytest tests/ -q
